events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server home:3000;
    }

    upstream backend {
        server finalproject:9988;
    }

    # HTTP 서버 (80) → HTTPS 리다이렉트 + Certbot 인증 처리
    server {
        listen 80;
        server_name cinemate.shop www.cinemate.shop;

        # Certbot 인증 파일을 위한 경로
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 그 외 요청은 HTTPS로 리다이렉트
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 서버 (443)
    server {
        listen 443 ssl;
        server_name cinemate.shop www.cinemate.shop;

        # SSL 인증서 경로
        ssl_certificate /etc/letsencrypt/live/cinemate.shop/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cinemate.shop/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # 공통 헤더 (CORS 등)
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept, Authorization';
        add_header Access-Control-Allow-Credentials true;
        add_header Access-Control-Expose-Headers 'accessToken, Content-Disposition';

        # React 앱 (Frontend)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API 요청 (Backend)
        location /api/ {
            # Preflight 요청 처리
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
                add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept, Authorization';
                add_header Access-Control-Allow-Credentials true;
                add_header Access-Control-Expose-Headers 'accessToken, Content-Disposition';
                return 204;
            }

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
