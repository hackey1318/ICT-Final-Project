http {
    upstream frontend {
        server home:3000;
    }

    upstream backend {
        server finalproject:9988;
    }

    server {
        listen 80;
        server_name cinemate.shop www.cinemate.shop;  # 구매한 도메인 추가

        # CORS 설정
        add_header Access-Control-Allow-Origin http://localhost:3000;
        add_header Access-Control-Allow-Origin http://192.168.1.252:3000;
        add_header Access-Control-Allow-Origin http://cinemate.shop;
        add_header Access-Control-Allow-Origin http://www.cinemate.shop;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept, Authorization';
        add_header Access-Control-Allow-Credentials true;
        add_header Access-Control-Expose-Headers 'accessToken, Content-Disposition';

        # Main frontend location
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API location
        location /api/ {
            # CORS preflight (OPTIONS)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin http://localhost:3000;
                add_header Access-Control-Allow-Origin http://192.168.1.252:3000;
                add_header Access-Control-Allow-Origin http://cinemate.shop;
                add_header Access-Control-Allow-Origin http://www.cinemate.shop;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
                add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept, Authorization';
                add_header Access-Control-Allow-Credentials true;
                add_header Access-Control-Expose-Headers 'accessToken, Content-Disposition';
                return 204;
            }

            # Regular API requests (GET, POST, etc.)
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
