spring.application.name=final

server.port=9988
spring.messages.encoding=UTF-8

# DB Setup (Docker MySQL ??)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql-db:3306/shopping?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.mvc.static-path-pattern=/static/**
spring.resources.static-locations=classpath:/static/

# email setup
spring.mail.host=smtp.naver.com
spring.mail.port=587
spring.mail.username=${MAIL_ADDR}
spring.mail.password=${MAIL_PW}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT setup
jwt.secret=${JWT_SECRET}

kakao.login.api_key=${KAKAO_LOGIN_API_KEY}
kakao.login.client_secret=${KAKAO_LOGIN_CLIENT_SECRET}

# code
kakao.login.redirect_uri=https://cinemate.shop/kakao/callback
kakao.login.uri.code=/oauth/authorize
kakao.login.uri.base=https://kauth.kakao.com

# get token
kakao.login.uri.token=/oauth/token

# login
kakao.api.uri.base=https://kapi.kakao.com
kakao.api.uri.user=/v2/user/me
